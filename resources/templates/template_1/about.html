<!-- HA Tech students: Yeh is template ka About page hai, is me grid aur layouts samjhaye gaye hain -->
<!-- HTML5 ka document type -->
<!DOCTYPE html>
<!-- HTML ka main tag English language k sath -->
<html lang="en">
<!-- Head section jahan files aur links load hote hain -->

<head>
    <!-- Har character aur symbol display karne ki support -->
    <meta charset="UTF-8">
    <!-- Responsive banane k liye zaroori meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page ka naam jo upar browser tab me nazar ayega -->
    <title>About [[FULL_NAME]]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '[[PRIMARY_COLOR]]',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b1120; font-family: sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-blob {
            mix-blend-screen: screen;
            filter: blur(120px);
        }
    </style>
</head>
<body class="antialiased text-white relative min-h-screen overflow-y-auto">
    <div class="absolute -top-[10%] left-[20%] w-[40vw] h-[40vw] bg-indigo-600 rounded-full glow-blob opacity-30 fixed"></div>
    <div class="absolute bottom-[0%] right-[10%] w-[30vw] h-[30vw] bg-pink-600 rounded-full glow-blob opacity-30 fixed"></div>

        <div class="text-3xl font-extrabold tracking-tighter">
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-indigo-400">[[FULL_NAME]]</span>
        </div>
        <div class="hidden md:flex gap-10 font-bold text-gray-300">
            <a href="index.html" class="hover:text-white transition-colors">Home</a>
            <a href="about.html" class="text-white transition-colors">About</a>
            <a href="contact.html" class="hover:text-white transition-colors">Contact</a>
        </div>
        <a href="contact.html" class="px-6 py-2 rounded-full border border-white/20 hover:bg-white/10 transition-all font-semibold">
            Let's Talk <i class="fa-solid fa-arrow-right ml-2 text-pink-400"></i>
        </a>
    </nav>

    <main class="relative z-10 max-w-7xl mx-auto px-6 py-12">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-black mb-4">About <span class="text-indigo-400">Me</span></h1>
            <p class="text-gray-400 max-w-2xl mx-auto">[[BIO]]</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="glass-panel p-8 rounded-3xl flex flex-col items-center border border-white/10 col-span-1">
                <div class="w-32 h-32 rounded-full bg-gray-800 overflow-hidden mb-6 border-4 border-indigo-500/50 shadow-[0_0_20px_rgba(99,102,241,0.5)] flex items-center justify-center">
                    <img src="assets/hero.jpg" alt="[[FULL_NAME]]" class="w-full h-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=[[FULL_NAME]]&background=random'" />
                </div>
                <h2 class="text-2xl font-bold mb-2">[[FULL_NAME]]</h2>
                <p class="text-pink-400 font-semibold mb-6">[[TITLE]]</p>
                <div class="flex gap-4">
                    <a href="#" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-all"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-all"><i class="fa-brands fa-linkedin-in text-blue-400"></i></a>
                </div>
            </div>

            <div class="glass-panel p-8 md:p-12 rounded-3xl col-span-1 md:col-span-2">
                <h3 class="text-2xl font-bold mb-4 border-b border-white/10 pb-4">My Journey</h3>
                <p class="text-gray-300 mb-8 leading-relaxed">[[BIO_EXTENDED]]</p>
                
                <h3 class="text-xl font-bold mb-6">Technical Skills</h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    [[SKILLS_HTML]]
                </div>
            </div>
        </div>
    </main>
</body>
</html>
