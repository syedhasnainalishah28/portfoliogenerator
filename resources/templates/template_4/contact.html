<!-- HA Tech Portfolio Contact Page: Forms aur Inputs sikhne k liye -->
<!-- HTML5 declaration, website structure k liye laazmi hai -->
<!DOCTYPE html>
<!-- yahan html start huwa, language english (en) hai -->
<html lang="en">
<!-- head mai meta data aur CDN links hotay hain -->

<head>
    <!-- characters encode karna, letters sahi se show hon -->
    <meta charset="UTF-8">
    <!-- screen ki width k hisab se set hona mobile views k liye -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Top tab pe naam -->
    <title>Contact [[FULL_NAME]]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '[[PRIMARY_COLOR]]',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Library icons k liye -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS ki styling tag -->
    <style>
        /* dark background */
        body {
            background-color: #0b1120;
            font-family: sans-serif;
        }

        /* Main Glassmorphism class (Sheeshay jesa design) */
        .glass-panel {
            /* rgba se rang ko shafaf(transparent) rakhte hain */
            background: rgba(255, 255, 255, 0.05);
            /* dhundli background property jo filter karti hai */
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            /* border halka aur kinaron ka style deta hai */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Roshni effects background mai chalne k liye */
        .glow-blob {
            mix-blend-screen: screen;
            filter: blur(120px);
        }

        /* jab form input pe click karein peela dabba hata de */
        input:focus,
        textarea:focus {
            outline: none;
            /* click karne par border rang tabdeel hoga */
            border-color: rgba(244, 114, 182, 0.5);
            /* pink color border me */
            /* aur background ka rang shafaf hojaye */
            background-color: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<!-- Body, sara design yahan aata hai -->

<body class="antialiased text-white relative min-h-screen">

    <!-- Design shapes (Blobs) -->
    <!-- z-0 inko bottom layer per rakhta hai -->
    <div
        class="absolute top-[20%] right-[30%] w-[30vw] h-[30vw] bg-pink-600 rounded-full glow-blob opacity-30 fixed -z-10">
    </div>
    <div
        class="absolute bottom-[10%] left-[10%] w-[40vw] h-[40vw] bg-indigo-600 rounded-full glow-blob opacity-30 fixed -z-10">
    </div>

    <!-- Navigation Bar -->
    <nav class="relative z-50 flex justify-between items-center p-8 max-w-7xl mx-auto">
        <!-- Logo -->
        <div class="text-3xl font-extrabold tracking-tighter">
            <!-- bg-clip-text text ki boundaries tak gradient show karega -->
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-indigo-400">HA.</span>Tech
        </div>
        <!-- Center Links -->
        <div class="hidden md:flex gap-10 font-bold text-gray-300">
            <!-- home pe hover karny par rang white hojata hai -->
            <a href="index.html" class="hover:text-white transition-colors">Home</a>
            <!-- about link -->
            <a href="about.html" class="hover:text-white transition-colors">About</a>
            <!-- contact link (ab is page par hain tou iska text-white hai active k taur pe) -->
            <a href="contact.html" class="text-white transition-colors">Contact</a>
        </div>
        <!-- Call to action btn -->
        <a href="#"
            class="px-6 py-2 rounded-full border border-white/20 hover:bg-white/10 transition-all font-semibold">
            Follow <i class="fa-brands fa-twitter ml-2 text-blue-400"></i>
        </a>
    </nav>

    <!-- Page Content Area -->
    <!-- max-w-4xl is box ki total churai limit ko kam kar k usay darmiyan me karta hai mx-auto k zariye -->
    <main class="relative z-10 max-w-4xl mx-auto px-6 py-12">

        <!-- Hamara sheeshe wala bada form container -->
        <div class="glass-panel p-8 md:p-16 rounded-3xl border border-white/10">
            <!-- Text area heading -->
            <div class="text-center mb-10">
                <i
                    class="fa-regular fa-envelope-open text-5xl text-pink-400 mb-4 drop-shadow-[0_0_15px_rgba(244,114,182,0.8)]"></i>
                <h1 class="text-4xl font-black mb-2">Get In Touch</h1>
                <p class="text-gray-400">Have a project? Lets build something beautiful together.</p>
            </div>

            <!-- Form yahan se start hota hai, method post form data behjne k liye use hota hai -->
            <form action="#" method="POST" class="space-y-6">
                <!-- 2 inputs aik sath, grid method k sath (name aur email) -->
                <!-- sm:grid-cols-2 ka matlab phn k bad wali screens pe ye aik line mai 2 dabbe dikhayega -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Pehla column (Name input) -->
                    <div class="flex flex-col">
                        <!-- label input ko asaan alfaz mai samjhata hai (tasweer mai nahi text mai) -->
                        <label class="text-sm font-semibold text-gray-300 mb-2 ml-1">Your Name</label>
                        <!-- input field jahan user name likhega, rounded-xl kone goal karne k liye, p-4 andruni padding -->
                        <!-- bg-white/5 se box ka background dark transparent ho raha hai -->
                        <input type="text" placeholder="John Doe"
                            class="bg-white/5 border border-white/10 p-4 rounded-xl text-white transition-colors placeholder-gray-500">
                    </div>
                    <!-- Dusra column (Email input) -->
                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-gray-300 mb-2 ml-1">Email Address</label>
                        <!-- type="email" se browser chk karta hai k @ mojood hai ya nahi -->
                        <input type="email" placeholder="john@example.com"
                            class="bg-white/5 border border-white/10 p-4 rounded-xl text-white transition-colors placeholder-gray-500">
                    </div>
                </div>

                <!-- Topic selection (Subject) -->
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-gray-300 mb-2 ml-1">Subject</label>
                    <input type="text" placeholder="I need a new website..."
                        class="bg-white/5 border border-white/10 p-4 rounded-xl text-white transition-colors placeholder-gray-500">
                </div>

                <!-- Bada message box (Textarea) -->
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-gray-300 mb-2 ml-1">Your Message</label>
                    <!-- textarea tab lagate hain jab users ko ziyada alfaaz likhne hon, rows="5" iski height fix karta hai -->
                    <textarea rows="5" placeholder="Hi, I want to discuss..."
                        class="bg-white/5 border border-white/10 p-4 rounded-xl text-white transition-colors placeholder-gray-500 resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <!-- w-full button ko pori screen pe phaila dega, flex items center se icon text center mai aayega -->
                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-pink-500 to-indigo-600 hover:from-pink-400 hover:to-indigo-500 rounded-xl font-bold text-lg shadow-[0_0_20px_rgba(236,72,153,0.3)] transition-all">
                    Send Message <i class="fa-solid fa-paper-plane ml-2"></i>
                </button>
            </form>
        </div>
    </main>

</body>

</html>
